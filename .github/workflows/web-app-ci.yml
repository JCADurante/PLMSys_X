name: Local Web App Verification & Release CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-package:
    name: Verify & Create Downloadable Web App ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check & Linting
        run: npm run lint

      - name: Build Web Application Bundle
        run: npm run build

      - name: Verify Web Bundle Output (dist/index.html)
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: Production bundle dist/index.html is missing!"
            exit 1
          fi
          echo "SUCCESS: Production web bundle dist/index.html generated successfully."

      - name: Check for Residual Desktop API References (Electron / Tauri)
        run: |
          echo "Scanning src/ directory for unwanted Electron / Tauri leaks..."
          FOUND_DESKTOP=$(grep -rnwi "electronAPI\|@tauri-apps" src/ || true)
          if [ -n "$FOUND_DESKTOP" ]; then
            echo "ERROR: Found residual desktop integration references in src/:"
            echo "$FOUND_DESKTOP"
            exit 1
          fi
          echo "SUCCESS: No Electron or Tauri dependencies found in src/."

      - name: Package Standalone Web App ZIP
        run: |
          mkdir -p package_output
          mkdir -p staging_package
          cp -r dist staging_package/
          cp -r backend staging_package/
          cp -r sql staging_package/
          cp -r data staging_package/ || true
          cp START.bat staging_package/
          cp INSTALL-AND-RUN.bat staging_package/
          cp CHECK-NETWORK.bat staging_package/
          cp START-PRODUCTION.bat staging_package/
          cp DIAGNOSE.bat staging_package/
          cp start.sh staging_package/
          cp server.js staging_package/
          cp server.ts staging_package/
          cp package.json staging_package/
          cp HOW-TO-RUN.txt staging_package/
          cp README.md staging_package/
          cp CHANGELOG.md staging_package/
          python3 -c "import shutil; shutil.make_archive('package_output/plmsys-local-web-app', 'zip', 'staging_package')"
          echo "Created complete plmsys-local-web-app.zip with launchers and backend."

      - name: Upload Downloadable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plmsys-local-web-app
          path: package_output/plmsys-local-web-app.zip
          retention-days: 90

      - name: Create GitHub Release Asset (On Tagged Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: package_output/plmsys-local-web-app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

